<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="theme-color" content="#0f6b66"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><meta name="apple-mobile-web-app-title" content="دفتر"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر – نظام محاسبة وإدارة موارد</title>

<style>
:root{--bg:#f3f6f5;--sf:#fff;--ink:#12302f;--mu:#5f7775;--ln:#d9e3e1;--ac:#0f6b66;--ac2:#e3a72f;--rd:#b3412f;--gn:#1f7a4d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a19;--sf:#162625;--ink:#e4efed;--mu:#8fa8a5;--ln:#26403e;--ac:#3fb8ae;--ac2:#e3a72f;--rd:#e8806c;--gn:#5fc28f;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}.r2>*,.gr>*{min-width:0}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.6 Tajawal,Tahoma,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{padding:18px 16px 6px}h1{margin:0;font-size:22px;font-weight:800}header p{margin:0;color:var(--mu);font-size:13px}
main{padding:10px 14px;max-width:720px;margin:auto}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px}
.k small{color:var(--mu);display:block}.k b{font-size:20px;font-weight:800}
.k.big{grid-column:1/-1;background:var(--ac);color:#fff;border:0}.k.big small{color:#d3efec}.k.big b{font-size:30px}
h2{font-size:16px;margin:20px 0 8px}
form{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;display:grid;gap:8px}
input,select,button,textarea{font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);width:100%}
button{background:var(--ac);color:#fff;border:0;font-weight:700;cursor:pointer}button.s{background:var(--bg);color:var(--ink);border:1px solid var(--ln)}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500}
.w{overflow-x:auto}.n{font-variant-numeric:tabular-nums;white-space:nowrap}.g{color:var(--gn)}.b{color:var(--rd)}
.em{color:var(--mu);text-align:center;padding:16px;background:var(--sf);border:1px dashed var(--ln);border-radius:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mu);border:0;padding:6px 2px;font-size:11px;flex:1 0 62px;display:grid;gap:2px;justify-items:center}
nav button[aria-current=true]{color:var(--ac);font-weight:800}nav span{font-size:20px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cd{background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden}.cd img,.ph{width:100%;height:150px;object-fit:cover;display:block;background:var(--ln)}.in{padding:8px}.st{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}.st button{width:38px;padding:6px}#lb{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:9}#lb img{max-width:96%;max-height:90%;border-radius:8px}
#lb th{color:#555}@media print{body>*:not(#lb){display:none!important}#lb{position:static;display:block!important;background:#fff}.np{display:none}}
</style></head><body>
<header style="position:relative"><button id="lob" type="button" class="s" onclick="logout()" style="position:absolute;left:12px;top:14px;width:auto;padding:6px 12px;font-size:13px">تسجيل الخروج</button><h1>دفتر</h1><p>محاسبة، فواتير، ومخزون في مكان واحد</p><p id="cl" style="margin-top:2px">البيانات محفوظة على هذا الجهاز</p></header>
<main id="m"></main>
<nav id="nv"></nav>
<div id="lb" onclick="this.style.display='none'"></div>
<script src="libs/html2canvas.min.js"></script>
<script src="libs/jspdf.umd.min.js"></script>
<script>
const A={1000:'الصندوق',1100:'العملاء',1200:'المخزون',2000:'الموردون',2100:'ضريبة القيمة المضافة',3000:'رأس المال',4000:'المبيعات',4100:'خصومات المبيعات',4200:'إيرادات أخرى',5000:'تكلفة المبيعات',5100:'المصروفات',5200:'الرواتب'};
let S={items:[],inv:[],je:[]},tab='h';
try{const x=localStorage.getItem('daftar');if(x)S=JSON.parse(x)}catch(e){}
const save=()=>{try{mvDiff()}catch(e){}try{localStorage.setItem('daftar',JSON.stringify(S))}catch(e){}pushCloud()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>(Math.round(n*100)/100).toLocaleString('ar-EG');
const bal=c=>S.je.reduce((t,e)=>t+e.l.filter(x=>x.a==c).reduce((u,x)=>u+x.d-x.c,0),0);
const post=(t,l)=>{aud('قيد: '+t);S.je.unshift({t,dt:new Date().toLocaleDateString('ar-EG'),l:l.filter(x=>x.d||x.c)})};
const opts=o=>Object.entries(o).map(([k,v])=>`<option value="${k}">${v} (${k})</option>`).join('');
const T=[['h','◧','الرئيسية'],['i','▤','الفواتير'],['s','▦','المخزون'],['j','✎','القيود'],['v','▣','المندوب'],['x','▥','نقطة البيع'],['e','☺','الموظفون'],['r','Σ','التقارير']];
function nav(){nv.innerHTML=T.map(([k,i,t])=>`<button data-t="${k}" ${k==tab?'aria-current="true"':''}><span>${i}</span>${t}</button>`).join('')}
nv.onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;draw()}};
function draw(){nav();m.innerHTML=({h:home,i:invs,s:stock,j:jour,v:cat,x:pos,e:emp,r:rep})[tab]();window.scrollTo(0,0)}
function home(){const inc=-bal(4000)-bal(4100)-bal(4200),cg=bal(5000),ex=bal(5100);
return `<div class="sum"><div class="k big"><small>صافي الربح</small><b>${f(inc-cg-ex)}</b></div>
<div class="k"><small>الصندوق</small><b>${f(bal(1000))}</b></div><div class="k"><small>مستحق من العملاء</small><b>${f(bal(1100))}</b></div>
<div class="k"><small>المبيعات</small><b>${f(inc)}</b></div><div class="k"><small>مستحق للموردين</small><b>${f(-bal(2000))}</b></div></div>
<h2>آخر الحركات</h2>${S.je.length?`<div class="w"><table>${S.je.slice(0,6).map(e=>`<tr><td>${esc(e.t)}</td><td class="n">${e.dt}</td></tr>`).join('')}</table></div>`:'<div class="em">لا توجد حركات بعد. ابدأ بإضافة صنف في المخزون ثم أنشئ فاتورة.</div>'}
<h2>نسبة ضريبة القيمة المضافة %</h2><input type='number' min='0' step='any' value='${S.vat||0}' oninput='S.vat=+this.value||0;save()' aria-label='نسبة الضريبة'>`}
function invs(){return `<h2>فاتورة جديدة</h2><form onsubmit="return addInv(this)">
<div class="r2"><select name="ty"><option value="s">فاتورة بيع</option><option value="p">فاتورة شراء</option><option value="q">عرض سعر</option><option value="r">مرتجع مبيعات</option></select><select name="py"><option value="c">نقدي</option><option value="d">آجل</option></select></div>
<select name="it" required>${S.items.length?S.items.map(i=>`<option value="${i.id}">${esc(i.n)}</option>`).join(''):'<option value="">أضف صنفاً أولاً</option>'}</select>
<input name="pa" list="dlp" placeholder="اسم العميل أو المورد" maxlength="60"><datalist id="dlp">${[...(S.cu||[]),...(S.su||[])].map(p=>`<option value="${esc(p.n)}">`).join('')}</datalist>
<div class="r2"><input name="q" type="number" min="1" step="any" placeholder="الكمية" required><input name="pr" type="number" min="0" step="any" placeholder="السعر (اختياري)"></div><div class="r2"><input name="di" type="number" min="0" step="any" placeholder="خصم نقدي على الصنف"><input name="dc" type="number" min="0" step="any" placeholder="خصم نقدي على الفاتورة"></div><input name="dp" type="number" min="0" max="100" step="any" placeholder="خصم % على الفاتورة (للبيع وعرض السعر)">
<button>حفظ الفاتورة</button></form>
<h2>سجل الفواتير</h2>${S.inv.length?`<div class="w"><table><tr><th>النوع</th><th>الطرف</th><th>الإجمالي</th><th></th></tr>${S.inv.map((v,k)=>`<tr style='cursor:pointer' onclick='showInv(${k})'><td>${TY[v.ty]||'بيع'} ${v.py=='d'?'(آجل)':''} ${v.ty=='q'?`<button type='button' class='s' style='width:auto;padding:2px 8px' onclick='event.stopPropagation();conv(${k})'>حوّل لفاتورة</button>`:''}</td><td>${esc(v.pa||'—')}</td><td class="n">${f(v.tot)}</td><td><button type="button" class="s" style="width:auto;padding:2px 8px" aria-label="حذف" onclick="event.stopPropagation();delInv(${k})">🗑</button></td></tr>`).join('')}</table></div>`:'<div class="em">لا توجد فواتير.</div>'}`}
function addInv(F){const d=Object.fromEntries(new FormData(F)),it=S.items.find(i=>i.id==d.it);if(!it)return false;
const q=+d.q,s=d.ty=='s',pr=+d.pr||(s?it.p:it.c),tot=q*pr;
if(s&&q>it.q){alert('الكمية المتاحة في المخزون: '+it.q);return false}
const cr=d.py=='d';
if(s){it.q-=q;post('فاتورة بيع: '+it.n,[{a:cr?1100:1000,d:tot,c:0},{a:4000,d:0,c:tot},{a:5000,d:q*it.c,c:0},{a:1200,d:0,c:q*it.c}])}
else{it.c=pr;it.q+=q;post('فاتورة شراء: '+it.n,[{a:1200,d:tot,c:0},{a:cr?2000:1000,d:0,c:tot}])}
S.inv.unshift({ty:d.ty,py:d.py,pa:d.pa,tot});save();draw();return false}
function stock(){return `<h2>صنف جديد</h2><form onsubmit="addItem(this);return false">
<input name="n" placeholder="اسم الصنف" required maxlength="60"><div class="r2"><input name="q" type="number" min="0" step="any" placeholder="الكمية الافتتاحية" required><input name="c" type="number" min="0" step="any" placeholder="سعر التكلفة" required></div>
<input name="p" type="number" min="0" step="any" placeholder="سعر البيع" required><input name="bc" placeholder="الباركود (اختياري)" maxlength="40"><label>صورة المنتج (اختياري)<input name="im" type="file" accept="image/*"></label><button>إضافة الصنف</button></form>
<h2>الأصناف</h2>${S.items.length?`<div class="w"><table><tr><th>الصنف</th><th>الكمية</th><th>التكلفة</th><th>البيع</th><th></th></tr>${S.items.map(i=>`<tr><td>${i.img?`<img src="${i.img}" alt="" width=36 height=36 style="border-radius:6px;vertical-align:middle;object-fit:cover"> `:''}${esc(i.n)} <label title="تغيير الصورة">📷<input type=file hidden accept="image/*" onchange="setImg(${i.id},this)"></label></td><td class="n ${i.q<=3?'b':''}">${f(i.q)}</td><td class="n">${f(i.c)}</td><td class="n">${f(i.p)}</td><td><button type="button" class="s" style="width:auto;padding:4px 10px" onclick="editI(${i.id})">تعديل</button></td></tr>`).join('')}</table></div>`:'<div class="em">المخزون فارغ.</div>'}`}
async function addItem(F){const d=Object.fromEntries(new FormData(F));const i={id:Date.now(),n:d.n,q:+d.q,c:+d.c,p:+d.p,img:await shrink(d.im),bc:d.bc};S.items.push(i);
if(i.q*i.c>0)post('رصيد افتتاحي: '+i.n,[{a:1200,d:i.q*i.c,c:0},{a:3000,d:0,c:i.q*i.c}]);save();draw();return false}
function jour(){return `<h2>قيد يومية</h2><form onsubmit="return addJe(this)">
<input name="t" placeholder="البيان (مثال: إيجار الشهر)" required maxlength="80">
<select name="d" aria-label="مدين">${opts(A)}</select><select name="c" aria-label="دائن">${opts(A)}</select>
<input name="a" type="number" min="0.01" step="any" placeholder="المبلغ" required><button>ترحيل القيد</button></form>
<p style="color:var(--mu);font-size:13px">الحساب الأول مدين والثاني دائن. مثال: المصروفات مدين، الصندوق دائن.</p>
<h2>دفتر اليومية</h2>${S.je.length?S.je.map(e=>`<div class="k" style="margin-bottom:8px"><small>${e.dt}</small><button type="button" class="s" style="width:auto;padding:2px 10px;float:left" onclick="jedit(${S.je.indexOf(e)})">تعديل / حذف</button><b style="font-size:15px">${esc(e.t)}</b>${e.l.map(x=>`<div class="n">${A[x.a]}: <span class="${x.d?'g':'b'}">${x.d?'مدين '+f(x.d):'دائن '+f(x.c)}</span></div>`).join('')}</div>`).join(''):'<div class="em">لا توجد قيود.</div>'}`}
function addJe(F){const d=Object.fromEntries(new FormData(F));if(d.d==d.c){alert('اختر حسابين مختلفين');return false}
post(d.t,[{a:+d.d,d:+d.a,c:0},{a:+d.c,d:0,c:+d.a}]);save();draw();return false}
function rep(){let D=0,C=0;const rows=Object.keys(A).map(k=>{const b=bal(k),d=b>0?b:0,c=b<0?-b:0;D+=d;C+=c;return `<tr><td>${A[k]}</td><td class="n">${d?f(d):'—'}</td><td class="n">${c?f(c):'—'}</td></tr>`}).join('');
const inc=-bal(4000)-bal(4100)-bal(4200),cg=bal(5000),ex=bal(5100),inv=S.items.reduce((t,i)=>t+i.q*i.c,0);
return `<h2>ميزان المراجعة</h2><div class="w"><table><tr><th>الحساب</th><th>مدين</th><th>دائن</th></tr>${rows}<tr><th>المجموع</th><th class="n">${f(D)}</th><th class="n">${f(C)}</th></tr></table></div>
<h2>قائمة الدخل</h2><div class="w"><table><tr><td>الإيرادات</td><td class="n">${f(inc)}</td></tr><tr><td>تكلفة المبيعات</td><td class="n">${f(cg)}</td></tr><tr><td>مجمل الربح</td><td class="n">${f(inc-cg)}</td></tr><tr><td>المصروفات</td><td class="n">${f(ex)}</td></tr><tr><th>صافي الربح</th><th class="n ${inc-cg-ex<0?'b':'g'}">${f(inc-cg-ex)}</th></tr></table></div>
<h2>قيمة المخزون</h2><div class="k"><b>${f(inv)}</b></div>${stmt()}`}
let cart={},cust='';
function shrink(file){return new Promise(r=>{if(!file||!file.size)return r('');const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.72))};im.onerror=()=>r('');im.src=u})}
async function setImg(id,el){const i=S.items.find(x=>x.id==id);i.img=await shrink(el.files[0]);save();draw()}
function zoom(id){const i=S.items.find(x=>x.id==id);lb.innerHTML=`<img src="${i.img}" alt="${esc(i.n)}">`;lb.style.display='grid'}
function qty(id,d){const i=S.items.find(x=>x.id==id);cart[id]=Math.max(0,Math.min(i.q,(cart[id]||0)+d));m.innerHTML=cat()}
function cat(){const L=S.items.filter(i=>cart[i.id]),tot=L.reduce((t,i)=>t+cart[i.id]*i.p,0);
if(!S.items.length)return '<h2>كتالوج المندوب</h2><div class="em">أضف أصنافاً مع صورها من تبويب المخزون لتعرضها على الزبائن.</div>';
return `<div class="r2"><select onchange="cc=this.value;m.innerHTML=cat()" aria-label="الكتالوج"><option value="">كل المنتجات</option>${(S.cats||[]).map(x=>`<option value="${x.id}" ${x.id==cc?'selected':''}>${esc(x.n)}</option>`).join('')}</select><button type="button" class="s" onclick="mgr()">إدارة الكتالوجات</button></div>${shown().length?'':'<div class="em" style="margin-top:10px">الكتالوج فارغ. أضف أصنافاً من إدارة الكتالوجات.</div>'}${cmbBar()}<div class="gr" style="margin-top:10px">${shown().map(i=>`<div class="cd">${i.img?`<img src="${i.img}" alt="${esc(i.n)}" onclick="zoom(${i.id})">`:'<div class="ph"></div>'}<div class="in"><b>${esc(i.n)}</b><div class="n g">${f(i.p)}</div><small>المتاح: ${f(i.q)}</small>${qdTxt(i)}<div class="st"><button type="button" class="s" onclick="qty(${i.id},-1)" aria-label="إنقاص">−</button><b>${f(cart[i.id]||0)}</b><button type="button" onclick="qty(${i.id},1)" aria-label="زيادة">+</button></div><input type='number' min='0' step='any' placeholder='خصم نقدي للصنف' value='${idc[i.id]||''}' oninput='idc[${i.id}]=+this.value||0;upd()' style='margin-top:6px'></div></div>`).join('')}</div>
<h2>الطلب</h2><form onsubmit="return sendOrder(this)"><input name="cu" placeholder="اسم الزبون" maxlength="60" value="${esc(cust)}" oninput="cust=this.value"><select name="py"><option value="c">نقدي</option><option value="d">آجل</option></select><div class="r2"><input type='number' min='0' step='any' placeholder='خصم نقدي على الفاتورة' value='${dsc.c||''}' oninput='dsc.c=+this.value||0;upd()'><input type='number' min='0' max='100' step='any' placeholder='خصم % على الفاتورة' value='${dsc.p||''}' oninput='dsc.p=+this.value||0;upd()'></div><div class="k"><small>${L.length} منتجات — الإجمالي بعد الخصم والضريبة</small>${cmbNote()}<b id='tt'>${f(calc(L).tot)}</b></div><button>تأكيد الطلب وإصدار فاتورة</button></form>`}
function sendOrder(F){const L=S.items.filter(i=>cart[i.id]);if(!L.length){alert('أضف منتجات إلى الطلب أولاً');return false}
const cr=F.py.value=='d';let tot=0,cg=0;L.forEach(i=>{tot+=cart[i.id]*i.p;cg+=cart[i.id]*i.c;i.q-=cart[i.id]});
post('طلب مندوب: '+(cust||'زبون'),[{a:cr?1100:1000,d:tot,c:0},{a:4000,d:0,c:tot},{a:5000,d:cg,c:0},{a:1200,d:0,c:cg}]);
S.inv.unshift({ty:'s',py:F.py.value,pa:cust,tot});cart={};cust='';save();draw();return false}
const TY={s:'فاتورة بيع',p:'فاتورة شراء',q:'عرض سعر',r:'مرتجع مبيعات',t:'سند قبض'};let sp='';
const tx=t=>Math.round(t*(S.vat||0))/100,today=()=>new Date().toLocaleDateString('ar-EG');
function sale(g,cg,cr,d,D=0){const n=g-D,x=tx(n);post(d,[{a:cr?1100:1000,d:n+x,c:0},{a:4100,d:D,c:0},{a:4000,d:0,c:g},{a:2100,d:0,c:x},{a:5000,d:cg,c:0},{a:1200,d:0,c:cg}]);return x}
function addInv(F){const d=Object.fromEntries(new FormData(F)),it=S.items.find(i=>i.id==d.it);if(!it)return false;
const q=+d.q,ty=d.ty,pr=+d.pr||(ty=='p'?it.c:it.p),g=q*pr,di=Math.min(g,(+d.di||0)+((ty=='s'||ty=='q')?qa(it,q,pr):0)),D=(ty=='s'||ty=='q')?Math.min(g,di+(g-di)*(+d.dp||0)/100+(+d.dc||0)):0,t=g-D,x=tx(t),cr=d.py=='d',ls=[{n:it.n,q,p:pr,di}];
if(ty=='s'){if(q>it.q){alert('الكمية المتاحة في المخزون: '+it.q);return false}it.q-=q;sale(g,q*it.c,cr,'فاتورة بيع: '+it.n,D)}
else if(ty=='p'){it.c=pr;it.q+=q;post('فاتورة شراء: '+it.n,[{a:1200,d:t,c:0},{a:2100,d:x,c:0},{a:cr?2000:1000,d:0,c:t+x}])}
